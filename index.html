<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ultimate Ninja | Fan Prototype</title><style>
:root{color-scheme:dark;--gold:#ffbd54;--ink:#090d18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 10%,#293454,#090d18 65%);color:#f5f1e8;font-family:system-ui,-apple-system,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(18px,4vw);border-bottom:1px solid #ffffff24;background:#070a13b8}h1{font-size:clamp(24px,4vw,40px);font-style:italic;letter-spacing:-1px;margin:0;color:var(--gold);text-shadow:2px 3px #8c3a25}header small{color:#aeb5c7}main{max-width:1500px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:22px}.panel{border:1px solid #ffffff2c;background:linear-gradient(140deg,#17223abf,#0d1427e8);border-radius:20px;box-shadow:0 15px 50px #0007;overflow:hidden}.panelHead{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800}.panelHead h2{margin:4px 0;font-size:20px}.count{color:#aeb5c7;font-size:12px}.tools{display:flex;gap:10px;padding:0 18px 16px;flex-wrap:wrap}input,select{background:#080e1e;color:white;border:1px solid #ffffff3b;border-radius:10px;padding:12px;min-width:0}input{flex:1;min-width:150px}select{flex:1}.roster{padding:0 18px 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-height:620px;overflow:auto}.fighter{position:relative;min-height:150px;border:2px solid #ffffff25;border-radius:12px;overflow:hidden;background:linear-gradient(155deg,var(--tone),#111728 90%);color:white;padding:0;transition:transform .15s,border .15s}.fighter:active{transform:scale(.96)}.fighter.active{border-color:var(--gold);box-shadow:0 0 0 2px #ffbd5444,inset 0 0 35px #ffbd5433}.fighter .avatar{font-size:76px;display:block;line-height:115px;filter:drop-shadow(0 7px 3px #0007)}.fighter .name{display:block;background:#050a15d ound:#03050df2;display:none;align-items:center;justify-content:center;padding:20px;overflow:hidden}.overlay.open{display:flex}.scene{width:min(780px,100%);text-align:center;position:relative}.scene h2{font-size:clamp(28px,6vw,60px);font-style:italic;text-shadow:0 4px #000;margin:8px}.scene .effectAvatar{font-size:clamp(110px,25vw,210px);position:relative;display:block;animation:charge 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 0 40px var(--effect))}.scene .flash{position:absolute;inset:-30vh -50vw;background:radial-gradient(circle,var(--effect),transparent 60%);opacity:.25;animation:pulse .55s ease-in-out infinite alternate;pointer-events:none}.scene .effectText{font-weight:900;font-size:clamp(16px,3vw,30px);letter-spacing:2px;color:var(--gold)}.scene .stage{min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center}.scene button{margin:10px;background:#253450;color:white;border:1px solid #ffffff55;border-radius:9px;padding:12px 20px}.scene .progress{height:7px;background:#ffffff22;border-radius:5px;overflow:hidden}.scene .progress div{height:100%;background:var(--gold);width:0;transition:width .1s linear}@keyframes charge{from{transform:scale(.87) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}@keyframes pulse{to{opacity:.65;transform:scale(1.3)}}@media(max-width:900px){main{grid-template-columns:1fr}.roster{max-height:none;grid-template-columns:repeat(4,minmax(0,1fr))}.profile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px}.hero{grid-row:span 4}.actions{grid-column:1/-1}}@media(max-width:560px){header{padding:14px}header small{display:none}main{padding:10px;gap:12px}.roster{padding:0 10px 12px;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.fighter{min-height:116px}.fighter .avatar{font-size:54px;line-height:86px}.fighter .name{font-size:11px}.profile{display:block;padding:12px}.hero{min-height:220px}.panelHead{padding:15px}.tools{padding:0 10px 12px}}

</style></head><body><header><div><div class="eyebrow">FAN-MADE • SELECT YOUR FIGHTER</div><h1>ULTIMATE NINJA</h1></div><small>PHASE 01 / CHARACTER SELECT</small></header><main><section class="panel"><div class="panelHead"><div><div class="eyebrow">SHINOBI DATABASE</div><h2>Choose your legend</h2></div><span class="count" id="count"></span></div><div class="tools"><input id="search" placeholder="Search ninja, village, abilities…" aria-label="Search roster"><select id="filter" aria-label="Filter affiliation"><option value="all">All affiliations</option></select><button class="action secondary" id="random" style="flex:0">🎲 Random</button></div><div class="roster" id="roster"></div></section><section class="panel"><div class="profile"><div class="hero" id="hero"><span class="heroAvatar" id="heroAvatar"></span><span class="formTag" id="formTag"></span></div><div class="identity"><div class="eyebrow" id="affiliation"></div><h2 id="characterName"></h2><p id="alias"></p></div><p class="bio" id="bio"></p><div class="stats" id="stats"></div><div class="moves"><div class="eyebrow">SIGNATURE TECHNIQUES</div><p id="moves"></p><p><strong>Ultimate:</strong> <span id="ultimateName"></span></p></div><div class="actions"><button class="action secondary" id="transform">Change Form</button><button class="action" id="ultimate">⚡ Preview Ultimate</button></div></div></section></main><footer>Unofficial Naruto-inspired fan concept. Original emoji/CSS placeholder visuals. Not affiliated with rights holders.</footer><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Ultimate attack preview"><div class="scene" id="scene"><div class="flash"></div><div class="eyebrow">SECRET TECHNIQUE • CINEMATIC PREVIEW</div><h2 id="sceneTitle"></h2><div class="stage"><span class="effectAvatar" id="effectAvatar"></span><div class="effectText" id="effectText"></div></div><div class="progress"><div id="progressFill"></div></div><button id="replay">↻ Replay</button><button id="close">✕ const characters=[

];let selected='naruto',formIndex={},running=false,timer=null,raf=null;const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>characters.find(c=>c.id===selected);function renderRoster(){const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;const shown=characters.filter(c=>(filter==='all'||c.aff===filter)&&[c.name,c.alias,c.aff,c.moves,c.ultimate].join(' ').toLowerCase().includes(q));$('count').textContent=`${shown.length} / ${characters.length} FIGHTERS`;$('roster').innerHTML=shown.map((c,i)=>`<button class="fighter ${c.id===selected?'active':''}" data-id="${c.id}" style="--tone:${c.tone}" aria-label="Select ${escapeHtml(c.name)}" aria-pressed="${c.id===selected}"><span class="num">${String(characters.indexOf(c)+1).padStart(2,'0')}</span><span class="avatar">${c.emoji}</span><span class="name">${escapeHtml(c.name)}</span></button>`).join('')||'<p>No fighters found. Try another search.</p>';}function renderProfile(){const c=current(),f=c.forms[formIndex[c.id]||0],boost=f[2];$('hero').style.setProperty('--tone',c.tone);$('heroAvatar').textContent=f[1];$('formTag').textContent=f[0].toUpperCase();$('affiliation').textContent=c.aff.toUpperCase();$('characterName').textContent=c.name;$('alias').textContent=c.alias;$('bio').textContent=`${c.alias}. ${c.aff} shinobi. ${f[0]==='Base'?'Ready for battle.':`Currently using ${f[0]}.`}`;$('stats').innerHTML=['POWER','SPEED','DEFENSE'].map((s,i)=>{let n=Math.min(100,c.stats[i]+boost);return `<div class="stat"><strong>${s}</strong><div class="track"><div class="fill" style="width:${n}%"></div></div><b>${n}</b></div>`}).join('');$('moves').textContent=c.moves;$('ultimateName').textContent=c.ultimate;$('transform').disabled=c.forms.length===1;$('transform').textContent=c.forms.length===1?'No Alternate Form':`↻ Form: ${f[0]}`;}function select(id){selected=id;renderRoster();renderProfile();}function cycleForm(){const c=current();formIndex[c.id]=((formIndex[c.id]||0)+1)%c.forms.length;renderProfile();const hero=$('heroAvatar');hero.animate([{transform:'scale(.7) rotate(-10deg)',opacity:.2,filter:'brightness(3)'},{transform:'scale(1.2)',opacity:1,filter:'brightness(2)'},{transform:'scale(1)',filter:'brightness(1)'}],{duration:650,easing:'ease-out'});}const phases=[['CHAKRA AWAKENS',0],['SECRET TECHNIQUE',.28],['IMPACT!',.68],['FINISH',.88]];function stop(){running=false;clearTimeout(timer);cancelAnimationFrame(raf)}function preview(){stop();const c=current(),f=c.forms[formIndex[c.id]||0];$('overlay').classList.add('open');$('scene').style.setProperty('--effect',c.tone);$('sceneTitle').textContent=c.ultimate;$('effectAvatar').textContent=f[1];$('effectText').textContent='CHAKRA AWAKENS';$('progressFill').style.width='0%';running=true;let start=performance.now(),last=-1;function tick(now){if(!running)return;let t=Math.min((now-start)/4400,1);$('progressFill').style.width=`${t*100}%`;let idx=t<.28?0:t<.68?1:t<.88?2:3;if(idx!==last){$('effectText').textContent=idx===1?c.ultimate.toUpperCase():phases[idx][0];$('effectAvatar').animate(idx===2?[{transform:'scale(.6)',opacity:.3},{transform:'scale(1.8)',opacity:1},{transform:'scale(1)'}]:[{filter:'brightness(3)',transform:'scale(1.3)'},{filter:'brightness(1)',transform:'scale(1)'}],{duration:idx===2?550:350});last=idx;}if(t<1)raf=requestAnimationFrame(tick);else running=false;}raf=requestAnimationFrame(tick);}function close(){stop();$('overlay').classList.remove('open')};[...new Set(characters.map(c=>c.aff))].sort().forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;$('filter').append(o)});$('roster').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(b.dataset.id)});$('search').addEventListener('input',renderRoster);$('filter').addEventListener('change',renderRoster);$('random').addEventListener('click',()=>{const options=characters.filter(c=>c.id!==selected);select(options[Math.floor(Math.random()*options.length)].id)});$('transform').addEventListener('click',cycleForm);$('ultimate').addEventListener('click',preview);$('replay').addEventListener('click',preview);$('close').addEventListener('click',close);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='r'&&document.activeElement.tagName!=='INPUT'&&!$('overlay').classList.contains('open'))$('random').click()});select(selected);
